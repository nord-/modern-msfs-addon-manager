name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ModernMsfsAddonManager.slnx -c Release
      - run: dotnet test ModernMsfsAddonManager.slnx -c Release --no-build
